# Firebase App Hosting Configuration for BREAKING NEWS WALA Public Web (Next.js SSR)
# Backend: breakingnewswala (asia-southeast1)
# Documentation: docs/24-Deployment.md, docs/25-Environment.md

runConfig:
  cpu: 1
  memoryMiB: 512
  minInstances: 0
  maxInstances: 10
  concurrency: 80

env:
  - variable: NODE_ENV
    value: production
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_TELEMETRY_DISABLED
    value: "1"
    availability:
      - BUILD
      - RUNTIME

