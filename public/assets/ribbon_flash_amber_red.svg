<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 170" width="100%" height="100%">
  <defs>
    <linearGradient id="brightRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF1A1A" />
      <stop offset="100%" stop-color="#C40000" />
    </linearGradient>
    <linearGradient id="neonYellow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF200" />
      <stop offset="100%" stop-color="#FFD000" />
    </linearGradient>
  </defs>

  <!-- Top Yellow bar -->
  <rect x="100" y="12" width="760" height="7" rx="2" fill="#FFF200" />

  <g transform="translate(42, 0) skewX(-16)">
    <!-- Red महा -->
    <rect x="75" y="38" width="350" height="100" rx="3" fill="url(#brightRed)" stroke="#FFF200" stroke-width="3" />
    <!-- Yellow ब्रेकिंग -->
    <rect x="415" y="36" width="435" height="104" rx="3" fill="url(#neonYellow)" stroke="#000000" stroke-width="3" />

    <text
      x="250"
      y="114"
      fill="#FFFFFF"
      font-family="'Baloo 2', 'Noto Sans Devanagari', system-ui, sans-serif"
      font-size="70"
      font-weight="900"
      letter-spacing="2"
      text-anchor="middle"
    >महा</text>

    <text
      x="632"
      y="114"
      fill="#0A0A0A"
      font-family="'Baloo 2', 'Noto Sans Devanagari', system-ui, sans-serif"
      font-size="68"
      font-weight="900"
      letter-spacing="2"
      text-anchor="middle"
    >ब्रेकिंग</text>
  </g>

  <!-- Bottom Yellow bar -->
  <rect x="140" y="156" width="680" height="7" rx="2" fill="#FFF200" />
</svg>
