<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 170" width="100%" height="100%">
  <defs>
    <linearGradient id="pureYellow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFE600" />
      <stop offset="100%" stop-color="#FFCC00" />
    </linearGradient>
  </defs>

  <!-- Hazard striped border effect at top -->
  <rect x="80" y="16" width="800" height="8" rx="2" fill="#FFE600" />

  <!-- Single Solid High-Contrast Wide Badge -->
  <g transform="translate(40, 0) skewX(-14)">
    <rect x="70" y="36" width="790" height="106" rx="6" fill="url(#pureYellow)" stroke="#000000" stroke-width="4" />

    <!-- Left Red Accent Flag -->
    <rect x="76" y="42" width="24" height="94" rx="2" fill="#E50914" />
    <!-- Right Red Accent Flag -->
    <rect x="830" y="42" width="24" height="94" rx="2" fill="#E50914" />

    <!-- Text: ताज़ा ख़बर in pure bold black -->
    <text
      x="465"
      y="114"
      fill="#000000"
      font-family="'Baloo 2', 'Noto Sans Devanagari', system-ui, sans-serif"
      font-size="74"
      font-weight="900"
      letter-spacing="2"
      text-anchor="middle"
    >ताज़ा ख़बर</text>
  </g>

  <rect x="140" y="154" width="680" height="7" rx="2" fill="#FFE600" />
</svg>
