<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 150" width="100%" height="100%">
  <!-- Luxury Crimson & Metallic Gold Broadcast Ribbon -->
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="30%" stop-color="#FDE047"/>
      <stop offset="70%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
    <linearGradient id="deepCrimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B91C1C"/>
      <stop offset="50%" stop-color="#991B1B"/>
      <stop offset="100%" stop-color="#7F1D1D"/>
    </linearGradient>
  </defs>

  <!-- Gold Accent Header Bar -->
  <rect x="80" y="8" width="800" height="6" fill="url(#goldGrad)" rx="2"/>

  <g transform="translate(40, 0) skewX(-15)">
    <!-- Main Crimson Body -->
    <rect x="60" y="20" width="820" height="105" rx="4" fill="url(#deepCrimson)" stroke="url(#goldGrad)" stroke-width="4" />
    
    <!-- Gold Divider -->
    <line x1="500" y1="20" x2="500" y2="125" stroke="url(#goldGrad)" stroke-width="4" />

    <!-- Text एक्सक्लूसिव in Baloo 2 -->
    <text
      x="280"
      y="94"
      fill="#FFFFFF"
      font-family="'Baloo 2', 'Noto Sans Devanagari', system-ui, sans-serif"
      font-size="60"
      font-weight="900"
      letter-spacing="2"
      text-anchor="middle"
    >एक्सक्लूसिव</text>

    <!-- Text EXCLUSIVE with Gold Tint -->
    <text
      x="690"
      y="92"
      fill="#FEF08A"
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Arial Black', Impact, sans-serif"
      font-size="52"
      font-style="italic"
      font-weight="900"
      letter-spacing="2"
      text-anchor="middle"
    >EXCLUSIVE</text>
  </g>

  <!-- Gold Bottom Accent Line -->
  <rect x="160" y="132" width="640" height="5" fill="url(#goldGrad)" rx="2"/>
</svg>
