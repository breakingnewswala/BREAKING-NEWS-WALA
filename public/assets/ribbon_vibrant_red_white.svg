<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 150" width="100%" height="100%">
  <!-- High-Impact Newsroom Vibrant Red & Clean White -->
  <defs>
    <linearGradient id="vibrantRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="50%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
  </defs>

  <g transform="translate(40, 0) skewX(-14)">
    <!-- White Base Silhouette Behind for Clean Cut Shadow -->
    <rect x="52" y="16" width="836" height="114" rx="4" fill="#FFFFFF" />

    <!-- Left Pure White Plate: सुपर -->
    <rect x="56" y="20" width="380" height="106" rx="3" fill="#FFFFFF" />
    
    <!-- Right Vibrant Red Plate: ब्रेकिंग -->
    <rect x="440" y="20" width="444" height="106" rx="3" fill="url(#vibrantRed)" />

    <!-- Text: सुपर (Bold Red) -->
    <text
      x="246"
      y="94"
      fill="#DC2626"
      font-family="'Baloo 2', 'Noto Sans Devanagari', system-ui, sans-serif"
      font-size="68"
      font-weight="900"
      letter-spacing="2"
      text-anchor="middle"
    >सुपर</text>

    <!-- Text: ब्रेकिंग (Pure White) -->
    <text
      x="660"
      y="95"
      fill="#FFFFFF"
      font-family="'Baloo 2', 'Noto Sans Devanagari', system-ui, sans-serif"
      font-size="68"
      font-weight="900"
      letter-spacing="2"
      text-anchor="middle"
    >ब्रेकिंग</text>
  </g>
</svg>
