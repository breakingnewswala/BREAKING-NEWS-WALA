name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-ci:
    name: Web Application (React + Vite) Build & Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Type Check & Linting
        run: npm run lint

      - name: Build Production Bundle
        run: npm run build

      - name: Verify Production Distribution Artifacts
        run: |
          if [ ! -f "dist/index.html" ]; then
            echo "::error::dist/index.html does not exist."
            exit 1
          fi

          JS_COUNT=$(find dist/assets -name "*.js" | wc -l)
          CSS_COUNT=$(find dist/assets -name "*.css" | wc -l)

          if [ "$JS_COUNT" -eq 0 ]; then
            echo "::error::No JavaScript bundle generated in dist/assets."
            exit 1
          fi

          if [ "$CSS_COUNT" -eq 0 ]; then
            echo "::error::No CSS stylesheet generated in dist/assets."
            exit 1
          fi

          echo "Production artifacts successfully verified: dist/index.html ($JS_COUNT JS bundles, $CSS_COUNT CSS bundles)"
