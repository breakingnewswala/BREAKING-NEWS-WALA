name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-ci:
    name: Backend Monolith Tests & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Execute Backend Tests
        run: npm test --prefix packages/backend

      - name: Build Shared Backend Monolith
        run: npm run build --prefix packages/backend

  web-ci:
    name: Web Ecosystem Tests & Builds
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Execute Web Application Tests
        run: |
          npm test --prefix apps/web
          npm test --prefix apps/admin
          npm test --prefix apps/newsroom
          npm test --prefix apps/reporter

      - name: Build Next.js Public Web Portal
        run: npm run build --prefix apps/web

      - name: Build Vite SPAs (Admin, Newsroom, Reporter)
        run: |
          npm run build --prefix apps/admin
          npm run build --prefix apps/newsroom
          npm run build --prefix apps/reporter

  android-ci:
    name: Native Android Core Tests & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Run Android Unit Tests
        working-directory: android
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Assemble Android Debug APKs
        working-directory: android
        run: ./gradlew :app-reader:assembleDebug :app-reporter:assembleDebug --no-daemon

