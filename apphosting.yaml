# Firebase App Hosting Configuration for BREAKING NEWS WALA (React + Vite)
# Backend: breakingnewswala (asia-southeast1)

runConfig:
  cpu: 1
  memoryMiB: 512
  minInstances: 0
  maxInstances: 10
  concurrency: 80

env:
  - variable: NODE_ENV
    value: production
    availability:
      - BUILD
      - RUNTIME
